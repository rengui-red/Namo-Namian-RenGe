<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南无那面 · 仁格智能体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100vh;
  background:#f8f3eb;
  font-family:"Noto Serif SC",serif;
  color:#222222;
  overflow:hidden;
}
.wrap{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:40px 60px;
  gap:24px;
}
.seal{
  width:220px;
  height:220px;
}
h1{
  font-size:44px;
  color:#c8102e;
  font-weight:600;
  text-align:center;
}
.subtitle{
  font-size:20px;
  color:#b8a58b;
  text-align:center;
}
.maxim{
  font-size:32px;
  text-align:center;
  line-height:2.2;
  margin:12px 0;
}
.grid-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  width:100%;
  max-width:960px;
  margin-top:16px;
}
.card{
  border:1px solid #d8c9b8;
  padding:20px 24px;
  background:#fffbf6;
}
.card h3{
  color:#c8102e;
  font-size:20px;
  margin-bottom:12px;
}
.card p{
  font-size:16px;
  line-height:1.6;
}
.footer-tip{
  position:absolute;
  bottom:20px;
  font-size:14px;
  color:#777;
}
</style>
</head>
<body>
<div class="wrap">
  <!-- 仁字红印章 -->
  <svg class="seal" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <rect x="30" y="30" width="440" height="440" rx="6" fill="none" stroke="#c8102e" stroke-width="22"/>
    <path d="M135 115 L135 385 M175 175 L175 335 M235 155 L375 155 M305 155 L305 355 M235 255 L375 255 M235 355 L375 355" stroke="#c8102e" stroke-width="26" stroke-linecap="square" fill="none"/>
  </svg>

  <h1>南无那面 · 仁格智能体</h1>
  <div class="subtitle">人文伦理导向智能体项目</div>

  <div class="maxim">
凡我所算，以仁为界。<br>
凡我所向，南无那面。
  </div>

  <div class="grid-box">
    <div class="card">
      <h3>项目内核</h3>
      <p>以仁德伦理作为智能运行底层约束，拒绝纯粹工具理性，让AI承载人文价值，做到技术向善。</p>
    </div>
    <div class="card">
      <h3>定位场景</h3>
      <p>高校交叉学术研究、人文文化平台、AI伦理原型示范，配套金汤、影鉴、矩度平台项目矩阵。</p>
    </div>
    <div class="card">
      <h3>开源协议</h3>
      <p>代码 Apache‑2.0，文档 CC BY‑SA 4.0；附带完整免责文档，重视核心源码本地保密。</p>
    </div>
    <div class="card">
      <h3>价值主张</h3>
      <p>智能辅助人，而不凌驾于人；面向公共人文，可供学界审视迭代。</p>
    </div>
  </div>

  <div class="footer-tip">南无那面 · 仁格智能体</div>
</div>
</body>
</html>
