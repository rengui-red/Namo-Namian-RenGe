name: 伦理决策测试 CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 运行 v1.0 测试 (12个历史用例，确保向后兼容)
      run: python renge_test_v1.0_12cases.py

    - name: 运行 v2.0 测试 (20个最新用例)
      run: python renge_test_v2.0_20cases.py






